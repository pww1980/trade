# ============================================================
# End-of-Day Trading System – Konfiguration
# ============================================================

# Verzeichnisse
data_dir: ./data
output_dir: ./daily_reports
db_name: trading.db
log_dir: ./logs

# Beobachtungs-Tickers (US-Aktien, anpassbar)
tickers:
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN

# Yahoo Finance
yfinance:
  interval: "5m"    # Intraday-Intervall
  period: "5d"      # Rückblick für Indikatorberechnung

# Finnhub (kostenloser Free-Tier Key)
finnhub:
  api_key: "YOUR_FINNHUB_FREE_KEY"   # leer lassen = kein Sentiment

# Wirtschaftskalender
investing_calendar:
  url: "https://www.investing.com/economic-calendar/"
  min_impact: "MEDIUM"               # Mindestrelevanz: LOW | MEDIUM | HIGH

# KI-Provider: "claude" oder "chatgpt"
ai_provider: "claude"

claude:
  api_key: "ANTHROPIC_API_KEY"
  model: "claude-sonnet-4-6"
  max_tokens: 4096

openai:
  api_key: "OPENAI_API_KEY"
  model: "gpt-4o"
  max_tokens: 4096

# Signalparameter (regelbasiert, anpassbar)
signal:
  sma_fast: 20
  sma_slow: 50
  rsi_threshold: 50        # RSI muss unter diesem Wert liegen (BUY)
  macd_signal: true        # MACD-Histogram muss positiv sein
  obv_rising: true         # OBV muss gegenüber letztem Wert steigen
  volume_multiplier: 1.5   # Volumen > 1.5x 20-Tage-Durchschnitt

# Handelszeitfenster (MEZ / CET)
market_hours:
  open: "15:30"    # US-Marktöffnung in MEZ
  close: "22:00"   # US-Marktschluss in MEZ
  intraday_interval_sec: 300   # 5 Minuten

# ============================================================
# Paper-Trading-Simulation (Test Trade Modus)
# ============================================================
# Alle drei Modi laufen parallel. Am Tagesende werden Ergebnis
# im PDF-Report und in der DB festgehalten. Das Kapital und die
# offenen Positionen werden zum nächsten Tag übertragen.
# ============================================================

paper_trading:
  enabled: true
  starting_capital: 10000.0   # Startkapital in USD (für alle Modi gleich)
  commission_pct: 0.001       # 0,1 % Transaktionskosten pro Trade

  modes:

    # Vorsichtiger Modus: kleine Positionen, enger Stop-Loss, nur starke Signale
    conservative:
      max_position_pct: 0.05      # max 5 % des Portfolios pro Position
      max_positions: 3            # max 3 gleichzeitige Positionen
      stop_loss_pct: 0.02         # Stop-Loss 2 % unter Einstieg
      take_profit_pct: 0.05       # Take-Profit 5 % über Einstieg
      min_signal_strength: 0.8   # nur Signale mit Stärke ≥ 80 %

    # Normaler Modus: ausgewogene Parameter
    normal:
      max_position_pct: 0.10
      max_positions: 5
      stop_loss_pct: 0.03
      take_profit_pct: 0.08
      min_signal_strength: 0.6

    # Risiko-Modus: große Positionen, weiter Stop-Loss, auch schwächere Signale
    risk:
      max_position_pct: 0.25
      max_positions: 8
      stop_loss_pct: 0.05
      take_profit_pct: 0.15
      min_signal_strength: 0.4
